<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#008CA3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Minimal futuristic waveform orb / sound-orbit badge -->
  <g transform="translate(10, 8)">
    <circle cx="27" cy="27" r="26" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="27" cy="27" r="21" fill="#0D0F10" stroke="url(#cyanGlow)" stroke-width="2"/>
    <!-- Sound bars inside orb -->
    <rect x="17" y="22" width="2.5" height="10" rx="1.25" fill="#00E5FF"/>
    <rect x="22" y="16" width="2.5" height="22" rx="1.25" fill="#67F3FF"/>
    <rect x="27" y="12" width="2.5" height="30" rx="1.25" fill="#00E5FF" filter="url(#glow)"/>
    <rect x="32" y="18" width="2.5" height="18" rx="1.25" fill="#67F3FF"/>
    <rect x="37" y="24" width="2.5" height="6" rx="1.25" fill="#00E5FF"/>
    <!-- Orbiting glowing node -->
    <circle cx="48" cy="14" r="3.5" fill="#00E5FF" filter="url(#glow)"/>
  </g>
  <!-- DOPS Wordmark -->
  <text x="76" y="44" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="32" font-weight="900" letter-spacing="4" fill="#F5F7F8">DOPS</text>
  <!-- Persian subtitle badge -->
  <text x="78" y="58" font-family="'Vazirmatn', sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#00E5FF" opacity="0.85">پلتفرم آینده‌نگرانه پادکست فارسی</text>
</svg>